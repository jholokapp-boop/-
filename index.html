<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Art Camera - Mosaic & 10 FPS Optimized</title>
    <!-- Tailwind CSS for modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Microsoft ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-900 rounded-2xl shadow-2xl p-6 border border-gray-800 text-center">
        
        <!-- VIEW 1: Model Download Section -->
        <div id="downloadView">
            <h1 class="text-2xl font-bold text-pink-500 mb-2">✨ AI Mosaic Camera</h1>
            <p class="text-sm text-gray-400 mb-6">১০ FPS অপ্টিমাইজড ও ব্ল্যাক-স্ক্রিন মুক্ত সুপার ফাস্ট এআই ক্যামেরা! (~৫.১ MB)</p>
            
            <button id="downloadBtn" onclick="downloadModel()" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-200">
                📥 মডেল ডাউনলোড ও শুরু করুন
            </button>

            <div id="progressContainer" class="hidden mt-4">
                <div class="w-full bg-gray-800 rounded-full h-4 overflow-hidden border border-gray-700">
                    <div id="progressBar" class="bg-gradient-to-r from-pink-500 to-purple-500 h-full w-0 transition-all duration-100"></div>
                </div>
                <p id="progressText" class="text-xs text-gray-400 mt-2">ডাউনলোড হচ্ছে...</p>
            </div>
        </div>

        <!-- VIEW 2: Normal Camera Section (No Lag) -->
        <div id="cameraView" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-purple-400">🔴 স্বাভাবিক ক্যামেরা (ল্যাগ-মুক্ত)</h2>
            
            <div class="relative rounded-xl overflow-hidden bg-black border border-gray-800 aspect-[3/4] flex items-center justify-center shadow-inner">
                <video id="webcamVideo" class="w-full h-full object-cover" autoplay playsinline muted></video>
                
                <div id="recIndicator" class="absolute top-3 left-3 bg-red-600 text-white text-xs px-2.5 py-1 rounded-full font-bold hidden animate-pulse flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-white"></span> রেকর্ডিং হচ্ছে...
                </div>
            </div>

            <div class="flex justify-between items-center gap-2">
                <button onclick="switchCamera()" class="bg-gray-800 hover:bg-gray-700 p-3 rounded-xl text-sm font-medium border border-gray-700 transition">
                    🔄 ক্যামেরা ঘোরান
                </button>
                
                <button id="recordBtn" onclick="toggleRecording()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition">
                    ⏺️ রেকর্ড শুরু
                </button>
            </div>
        </div>

        <!-- VIEW 3: AI Processing Section -->
        <div id="processingView" class="hidden space-y-6 py-10">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-pink-500 border-solid mx-auto"></div>
            <h2 class="text-xl font-bold text-pink-400">এআই মোজাইক ফিল্টার প্রসেস হচ্ছে...</h2>
            <p id="processStatus" class="text-sm text-gray-400">দয়া করে অপেক্ষা করুন, ভিডিও তৈরি হচ্ছে (০%)</p>
        </div>

        <!-- VIEW 4: Video Preview & Download Section -->
        <div id="previewView" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-green-400">✅ এআই ভিডিও তৈরি সম্পন্ন!</h2>
            
            <div class="rounded-xl overflow-hidden bg-black border border-gray-800 aspect-[3/4] flex items-center justify-center">
                <video id="recordedVideo" controls class="w-full h-full object-cover"></video>
            </div>

            <div class="flex gap-3">
                <button onclick="retakeVideo()" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-medium border border-gray-700 transition">
                    🔄 আবার করুন
                </button>
                <a id="downloadLink" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold shadow-lg text-center transition flex items-center justify-center">
                    💾 ডাউনলোড করুন
                </a>
            </div>
        </div>

        <p id="statusMsg" class="text-xs text-gray-500 mt-4"></p>
    </div>

    <script>
        let session = null;
        let videoStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let useFrontCamera = true;

        const downloadView = document.getElementById('downloadView');
        const cameraView = document.getElementById('cameraView');
        const processingView = document.getElementById('processingView');
        const previewView = document.getElementById('previewView');
        
        const downloadBtn = document.getElementById('downloadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusMsg = document.getElementById('statusMsg');
        
        const webcamVideo = document.getElementById('webcamVideo');
        const recordBtn = document.getElementById('recordBtn');
        const recIndicator = document.getElementById('recIndicator');
        const processStatus = document.getElementById('processStatus');
        const recordedVideo = document.getElementById('recordedVideo');
        const downloadLink = document.getElementById('downloadLink');

        // সবচেয়ে স্থিতিশীল ও ফাস্ট মাইক্রো মডেল: Mosaic Model (~5.1 MB)
        const MODEL_URL = "https://github.com/onnx/models/raw/refs/heads/main/validated/vision/style_transfer/fast_neural_style/model/mosaic-9.onnx";

        async function downloadModel() {
            downloadBtn.disabled = true;
            progressContainer.classList.remove('hidden');
            statusMsg.innerText = "মডেল সার্ভার থেকে ডাউনলোড হচ্ছে...";

            try {
                const response = await fetch(MODEL_URL);
                if (!response.ok) throw new Error("নেটওয়ার্ক সমস্যা বা মডেল লোড ব্যর্থ হয়েছে।");

                const total = parseInt(response.headers.get('content-length'), 10);
                let loaded = 0;
                const reader = response.body.getReader();
                let chunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.length;

                    if (total) {
                        const percent = Math.round((loaded / total) * 100);
                        progressBar.style.width = percent + "%";
                        progressText.innerText = `${percent}% (${(loaded/(1024*1024)).toFixed(1)} MB)`;
                    }
                }

                statusMsg.innerText = "ইঞ্জিন কনফিগার করা হচ্ছে...";
                
                ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";
                ort.env.wasm.numThreads = navigator.hardwareConcurrency || 4;
                ort.env.wasm.simd = true;

                const blob = new Blob(chunks);
                const buffer = await blob.arrayBuffer();

                try {
                    session = await ort.InferenceSession.create(buffer, { executionProviders: ['webgpu'], graphOptimizationLevel: 'all' });
                } catch (e1) {
                    try {
                        session = await ort.InferenceSession.create(buffer, { executionProviders: ['webgl'], graphOptimizationLevel: 'all' });
                    } catch (e2) {
                        session = await ort.InferenceSession.create(buffer, { graphOptimizationLevel: 'all' });
                    }
                }

                downloadView.classList.add('hidden');
                cameraView.classList.remove('hidden');
                startCamera();

            } catch (err) {
                console.error(err);
                statusMsg.innerText = "ত্রুটি: মডেল ডাউনলোড করা যায়নি।";
                downloadBtn.disabled = false;
            }
        }

        async function startCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            try {
                videoStream =addons = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment', width: 224, height: 224 },
                    audio: false
                });
                webcamVideo.srcObject = videoStream;
            } catch (err) {
                alert("ক্যামেরা পারমিশন পাওয়া যায়নি!");
            }
        }

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            recordedChunks = [];
            
            let options = { mimeType: 'video/webm; codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = {};
                }
            }

            try {
                mediaRecorder = new MediaRecorder(videoStream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(videoStream);
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
                const rawBlob = new Blob(recordedChunks, { type: 'video/webm' });
                cameraView.classList.add('hidden');
                processingView.classList.remove('hidden');
                
                await processRecordedVideo(rawBlob);
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.innerText = "⏹️ রেকর্ডিং বন্ধ করুন";
            recordBtn.className = "bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition";
            recIndicator.classList.remove('hidden');
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.innerText = "⏺️ রেকর্ড শুরু";
            recordBtn.className = "bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition";
            recIndicator.classList.add('hidden');
        }

        // ১০ FPS অপ্টিমাইজড পোস্ট প্রসেসিং
        async function processRecordedVideo(blob) {
            const sourceVideo = document.createElement('video');
            sourceVideo.src = URL.createObjectURL(blob);
            sourceVideo.muted = true;
            sourceVideo.playsInline = true;
            sourceVideo.style.display = 'none';
            document.body.appendChild(sourceVideo);

            await new Promise((resolve) => {
                sourceVideo.onloadedmetadata = () => resolve();
            });

            sourceVideo.currentTime = 1e101;
            await new Promise(r => {
                sourceVideo.ontimeupdate = () => {
                    if (sourceVideo.duration && sourceVideo.duration !== Infinity) {
                        sourceVideo.ontimeupdate = null;
                        r();
                    }
                };
                setTimeout(r, 600);
            });
            sourceVideo.currentTime = 0;
            await new Promise(r => setTimeout(r, 100));

            const duration = (sourceVideo.duration && sourceVideo.duration !== Infinity) ? sourceVideo.duration : 3;

            const canvas = document.createElement('canvas');
            canvas.width = 224;
            canvas.height = 224;
            const pCtx = canvas.getContext('2d', { willReadFrequently: true });

            const processedChunks = [];
            const stream = canvas.captureStream(10); // ফ্রেম রেট কমিয়ে ১০ FPS করা হয়েছে
            
            let recOptions = { mimeType: 'video/webm' };
            if (!MediaRecorder.isTypeSupported(recOptions.mimeType)) recOptions = {};
            
            const procRecorder = new MediaRecorder(stream, recOptions);
            procRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) processedChunks.push(e.data);
            };

            const finishedPromise = new Promise(resolve => procRecorder.onstop = resolve);
            procRecorder.start();

            const fps = 10; // ১০ FPS এ প্রসেস হবে
            const dt = 1 / fps;
            let t = 0;

            while (t < duration) {
                sourceVideo.currentTime = t;
                await new Promise(r => {
                    sourceVideo.onseeked = r;
                    setTimeout(r, 80);
                });

                pCtx.drawImage(sourceVideo, 0, 0, 224, 224);
                const imgData = pCtx.getImageData(0, 0, 224, 224);
                
                await runAIOnImageData(imgData, pCtx);

                const percent = Math.min(100, Math.round((t / duration) * 100));
                processStatus.innerText = `দয়া করে অপেক্ষা করুন, ভিডিও তৈরি হচ্ছে (${percent}%)`;

                t += dt;
            }

            procRecorder.stop();
            await finishedPromise;
            sourceVideo.remove();

            const finalBlob = new Blob(processedChunks, { type: 'video/webm' });
            const finalUrl = URL.createObjectURL(finalBlob);

            recordedVideo.src = finalUrl;
            downloadLink.href = finalUrl;
            downloadLink.download = "ai-mosaic-filtered-video.webm";

            processingView.classList.add('hidden');
            previewView.classList.remove('hidden');
        }

        async function runAIOnImageData(imgData, ctxTarget) {
            try {
                const d = imgData.data;
                const inputFloat = new Float32Array(3 * 224 * 224);
                const stride = 224 * 224;
                for (let i = 0; i < stride; i++) {
                    inputFloat[i] = d[i * 4];         
                    inputFloat[stride + i] = d[i * 4 + 1]; 
                    inputFloat[2 * stride + i] = d[i * 4 + 2]; 
                }
                const inputTensor = new ort.Tensor('float32', inputFloat, [1, 3, 224, 224]);

                const feeds = { [session.inputNames[0]]: inputTensor };
                const results = await session.run(feeds);
                const output = results[session.outputNames[0]].data;

                const outImgData = ctxTarget.createImageData(224, 224);
                const od = outImgData.data;
                for (let i = 0; i < stride; i++) {
                    od[i * 4] = Math.min(255, Math.max(0, output[i]));
                    od[i * 4 + 1] = Math.min(255, Math.max(0, output[stride + i]));
                    od[i * 4 + 2] = Math.min(255, Math.max(0, output[2 * stride + i]));
                    od[i * 4 + 3] = 255;
                }
                ctxTarget.putImageData(outImgData, 0, 0);
            } catch (err) {
                console.error("AI Post-processing error:", err);
            }
        }

        function retakeVideo() {
            previewView.classList.add('hidden');
            cameraView.classList.remove('hidden');
            startCamera();
        }
    </script>
</body>
</html>
