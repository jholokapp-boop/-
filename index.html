<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Real-Time Style Camera (ONNX Web)</title>
    <!-- Tailwind CSS for modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Microsoft ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-900 rounded-2xl shadow-2xl p-6 border border-gray-800 text-center">
        
        <!-- VIEW 1: Model Download Section -->
        <div id="downloadView">
            <h1 class="text-2xl font-bold text-pink-500 mb-2">✨ AI Art Camera</h1>
            <p class="text-sm text-gray-400 mb-6">ইনস্টাগ্রামের মতো রিয়েল-টাইম আর্ট ফিল্টার ক্যামেরা। (মডেল সাইজ: ~৬.৭ MB)</p>
            
            <button id="downloadBtn" onclick="downloadModel()" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-200">
                📥 মডেল ডাউনলোড ও শুরু করুন
            </button>

            <div id="progressContainer" class="hidden mt-4">
                <div class="w-full bg-gray-800 rounded-full h-4 overflow-hidden border border-gray-700">
                    <div id="progressBar" class="bg-gradient-to-r from-pink-500 to-purple-500 h-full w-0 transition-all duration-100"></div>
                </div>
                <p id="progressText" class="text-xs text-gray-400 mt-2">ডাউনলোড হচ্ছে...</p>
            </div>
        </div>

        <!-- VIEW 2: Camera & Live Filter Section -->
        <div id="cameraView" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-purple-400">🔴 রিয়েল-টাইম ফিল্টার ক্যামেরা</h2>
            
            <!-- Hidden Video Source & Canvas Preview -->
            <div class="relative rounded-xl overflow-hidden bg-black border border-gray-800 aspect-[3/4] flex items-center justify-center shadow-inner">
                <video id="webcamVideo" class="hidden" autoplay playsinline muted></video>
                <canvas id="outputCanvas" class="w-full h-full object-cover"></canvas>
                
                <div id="recIndicator" class="absolute top-3 left-3 bg-red-600 text-white text-xs px-2.5 py-1 rounded-full font-bold hidden animate-pulse flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-white"></span> রেকর্ডিং...
                </div>
            </div>

            <!-- Controls -->
            <div class="flex justify-between items-center gap-2">
                <button onclick="switchCamera()" class="bg-gray-800 hover:bg-gray-700 p-3 rounded-xl text-sm font-medium border border-gray-700 transition">
                    🔄 ক্যামেরা ঘোরান
                </button>
                
                <button id="recordBtn" onclick="toggleRecording()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition">
                    ⏺️ রেকর্ড শুরু
                </button>
            </div>
        </div>

        <!-- VIEW 3: Video Preview & Download Section -->
        <div id="previewView" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-green-400">✅ ভিডিও তৈরি সম্পন্ন!</h2>
            
            <div class="rounded-xl overflow-hidden bg-black border border-gray-800 aspect-[3/4] flex items-center justify-center">
                <video id="recordedVideo" controls class="w-full h-full object-cover"></video>
            </div>

            <div class="flex gap-3">
                <button onclick="retakeVideo()" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-medium border border-gray-700 transition">
                    🔄 আবার করুন
                </button>
                <a id="downloadLink" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold shadow-lg text-center transition flex items-center justify-center">
                    💾 ডাউনলোড করুন
                </a>
            </div>
        </div>

        <p id="statusMsg" class="text-xs text-gray-500 mt-4"></p>
    </div>

    <script>
        let session = null;
        let videoStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let useFrontCamera = true;
        let animationFrameId = null;

        const downloadView = document.getElementById('downloadView');
        const cameraView = document.getElementById('cameraView');
        const previewView = document.getElementById('previewView');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusMsg = document.getElementById('statusMsg');
        
        const webcamVideo = document.getElementById('webcamVideo');
        const outputCanvas = document.getElementById('outputCanvas');
        const ctx = outputCanvas.getContext('2d', { willReadFrequently: true });
        
        const recordBtn = document.getElementById('recordBtn');
        const recIndicator = document.getElementById('recIndicator');
        const recordedVideo = document.getElementById('recordedVideo');
        const downloadLink = document.getElementById('downloadLink');

        // আপডেট করা Hugging Face স্ট্যাবল ডাইরেক্ট লিঙ্ক (Candy Style Transfer ONNX Model - ~6.7 MB)
        const MODEL_URL = "https://huggingface.co/onnxmodelzoo/candy-9/resolve/main/candy-9.onnx";

        // ১. মডেল ডাউনলোড ও হার্ডওয়্যার এক্সিলারেশন সেটআপ
        async function downloadModel() {
            downloadBtn.disabled = true;
            progressContainer.classList.remove('hidden');
            statusMsg.innerText = "মডেল সার্ভার থেকে ডাউনলোড হচ্ছে...";

            try {
                const response = await fetch(MODEL_URL);
                if (!response.ok) throw new Error("নেটওয়ার্ক সমস্যা বা মডেল লোড ব্যর্থ হয়েছে।");

                const total = parseInt(response.headers.get('content-length'), 10);
                let loaded = 0;
                const reader = response.body.getReader();
                let chunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.length;

                    if (total) {
                        const percent = Math.round((loaded / total) * 100);
                        progressBar.style.width = percent + "%";
                        progressText.innerText = `${percent}% (${(loaded/(1024*1024)).toFixed(1)} MB)`;
                    }
                }

                statusMsg.innerText = "ইঞ্জিন কনফিগার করা হচ্ছে...";
                
                ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";
                ort.env.wasm.numThreads = navigator.hardwareConcurrency || 4;
                ort.env.wasm.simd = true;

                const blob = new Blob(chunks);
                const buffer = await blob.arrayBuffer();

                // WebGPU -> WebGL -> CPU অটো ফলব্যাক
                try {
                    session = await ort.InferenceSession.create(buffer, { executionProviders: ['webgpu'], graphOptimizationLevel: 'all' });
                } catch (e1) {
                    try {
                        session = await ort.InferenceSession.create(buffer, { executionProviders: ['webgl'], graphOptimizationLevel: 'all' });
                    } catch (e2) {
                        session = await ort.InferenceSession.create(buffer, { graphOptimizationLevel: 'all' });
                    }
                }

                // ভিউ পরিবর্তন করে ক্যামেরা ভিউতে যাওয়া
                downloadView.classList.add('hidden');
                cameraView.classList.remove('hidden');
                startCamera();

            } catch (err) {
                console.error(err);
                statusMsg.innerText = "ত্রুটি: মডেল ডাউনলোড করা যায়নি। ইন্টারনেট কানেকশন চেক করুন।";
                downloadBtn.disabled = false;
            }
        }

        // ২. ক্যামেরা চালু করা
        async function startCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment', width: 224, height: 224 },
                    audio: false
                });
                webcamVideo.srcObject = videoStream;
                webcamVideo.onloadedmetadata = () => {
                    webcamVideo.play();
                    outputCanvas.width = 224;
                    outputCanvas.height = 224;
                    runRealTimeInference();
                };
            } catch (err) {
                alert("ক্যামেরা পারমিশন পাওয়া যায়নি!");
            }
        }

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        // ৩. রিয়েল-টাইম এআই ফিল্টার প্রসেসিং ও রেন্ডারিং লুপ
        async function runRealTimeInference() {
            if (cameraView.classList.contains('hidden')) return;

            if (webcamVideo.readyState >= webcamVideo.HAVE_CURRENT_DATA) {
                ctx.drawImage(webcamVideo, 0, 0, 224, 224);
                const imgData = ctx.getImageData(0, 0, 224, 224);
                const d = imgData.data;

                const inputFloat = new Float32Array(3 * 224 * 224);
                const stride = 224 * 224;
                for (let i = 0; i < stride; i++) {
                    inputFloat[i] = d[i * 4];         // R
                    inputFloat[stride + i] = d[i * 4 + 1]; // G
                    inputFloat[2 * stride + i] = d[i * 4 + 2]; // B
                }
                const inputTensor = new ort.Tensor('float32', inputFloat, [1, 3, 224, 224]);

                try {
                    const feeds = { [session.inputNames[0]]: inputTensor };
                    const results = await session.run(feeds);
                    const output = results[session.outputNames[0]].data;

                    const outImgData = ctx.createImageData(224, 224);
                    const od = outImgData.data;
                    for (let i = 0; i < stride; i++) {
                        od[i * 4] = Math.min(255, Math.max(0, output[i]));
                        od[i * 4 + 1] = Math.min(255, Math.max(0, output[stride + i]));
                        od[i * 4 + 2] = Math.min(255, Math.max(0, output[2 * stride + i]));
                        od[i * 4 + 3] = 255;
                    }
                    ctx.putImageData(outImgData, 0, 0);
                } catch (err) {
                    console.error("Inference frame error:", err);
                }
            }

            animationFrameId = requestAnimationFrame(runRealTimeInference);
        }

        // ৪. ভিডিও রেকর্ডিং ফিচার
        function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            recordedChunks = [];
            const canvasStream = outputCanvas.captureStream(30);
            
            try {
                mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm; codecs=vp9' });
            } catch (e) {
                mediaRecorder = new MediaRecorder(canvasStream);
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const videoUrl = URL.createObjectURL(blob);
                
                recordedVideo.src = videoUrl;
                downloadLink.href = videoUrl;
                downloadLink.download = "ai-art-filtered-video.webm";

                cameraView.classList.add('hidden');
                previewView.classList.remove('hidden');
                cancelAnimationFrame(animationFrameId);
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.innerText = "⏹️ রেকর্ডিং বন্ধ করুন";
            recordBtn.className = "bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition";
            recIndicator.classList.remove('hidden');
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.innerText = "⏺️ রেকর্ড শুরু";
            recordBtn.className = "bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition";
            recIndicator.classList.add('hidden');
        }

        function retakeVideo() {
            previewView.classList.add('hidden');
            cameraView.classList.remove('hidden');
            startCamera();
        }
    </script>
</body>
</html>
